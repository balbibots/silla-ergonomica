name: Vigilar precio de la silla

on:
  # El "schedule" automatico esta DESACTIVADO a proposito: el bot ahora
  # corre en Docker en una Raspberry Pi propia (ver README, seccion
  # "Desplegar en tu propio servidor"), porque Amazon bloquea las peticiones
  # desde las IPs de GitHub Actions de forma permanente (lo confirmamos
  # viendo que fallaban el 100% de las ejecuciones automaticas, mientras que
  # desde cualquier otra red funcionaba sin problema).
  #
  # Se deja "workflow_dispatch" por si alguna vez quieres lanzarlo a mano
  # desde aqui para probar algo puntual - pero la vigilancia real de verdad
  # vive en la Raspberry Pi, no aqui.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar los precios
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEARTBEAT_DAYS: "7"
          NOTIFY_ON_ANY_CHANGE: "true"
          REINTENTOS: "2"
          ESPERA_ENTRE_REINTENTOS_SEG: "5"
        run: python check_price.py

      - name: Guardar el estado
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "estado: comprobacion automatica de precios"
            git push
          else
            echo "Sin cambios en el estado."
          fi
